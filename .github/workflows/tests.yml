name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned Python image
        run: docker pull python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      - name: Check real Docker boundaries and product execution
        run: python -m unittest discover -s tests -p test_product_runner.py -v
        env:
          BAO_TEST_DOCKER: '1'
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependencies
        run: python -m pip check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - name: Verify JavaScript parser
        run: |
          node --check tests/ui/dashboard.spec.cjs
          node --check quality_ui.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install browser test dependencies
        run: npm ci --prefix tests/ui
      - name: Check dashboard formatting
        run: npm run format:check --prefix tests/ui
      - name: Install Chromium
        working-directory: tests/ui
        run: npx playwright install --with-deps --only-shell chromium
      - name: Exercise dashboard in Chromium
        run: npm test --prefix tests/ui
        env:
          BAO_TEST_PYTHON: python
      - name: Save browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-traces-${{ matrix.os }}
          path: tests/ui/test-results
          if-no-files-found: ignore
          retention-days: 7
